name: heartbeat

# GitHub disables scheduled workflows in a repository with no activity for 60 days.
#
# Nobody will ever push to this repo by hand — it exists to run a cron — so without this it
# would quietly switch itself off about two months in, and the first anyone would notice is a
# slow-loading app. This commits a timestamp twice a month to keep the repository active.

on:
  schedule:
    - cron: '23 7 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Record a heartbeat
        run: |
          set -euo pipefail
          date -u '+%Y-%m-%dT%H:%M:%SZ' > LAST_HEARTBEAT
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LAST_HEARTBEAT
          # Nothing to commit is not a failure: it just means the timestamp did not change,
          # which cannot normally happen but should not break the run if it does.
          git diff --staged --quiet || git commit -m "Heartbeat $(cat LAST_HEARTBEAT)"
          git push
