name: keep-awake

# Render spins a free web service down after 15 minutes with no traffic, and the next visitor
# waits ~50 seconds for it to come back. This sends a request often enough that the window
# never elapses.
#
# It lives in a PUBLIC repo on purpose: GitHub bills every job as a whole minute even if it
# runs for three seconds, and a private repo only gets 2,000 free minutes a month. At six runs
# an hour this would be ~4,300 billable minutes — about $14/month. Public repos get unlimited
# Actions minutes, so here it costs nothing.

on:
  schedule:
    # Deliberately off the hour. GitHub's scheduler is busiest at :00 and delays of 20-40
    # minutes are common there — long enough for the service to sleep before the ping lands.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

# A delayed run must not stack on top of the next scheduled one.
concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping the backend
        env:
          TARGET: ${{ secrets.BACKEND_URL }}
        run: |
          set -uo pipefail

          if [ -z "${TARGET:-}" ]; then
            echo "::error::BACKEND_URL secret is not set on this repository."
            echo "Set it with: gh secret set BACKEND_URL --repo Formax-app/formax-keepalive"
            exit 1
          fi

          # A cold start on Render takes roughly 50 seconds, so the timeout has to sit well
          # past that — otherwise the one request that matters most is the one we abandon.
          read -r code seconds <<< "$(
            curl -sS -o /dev/null \
              -w '%{http_code} %{time_total}' \
              --max-time 120 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              "$TARGET" 2>/dev/null || echo '000 0'
          )"

          echo "HTTP $code in ${seconds}s"

          if [ "$code" = "000" ]; then
            echo "::error::No response from the backend after retries."
            exit 1
          fi

          # Any HTTP status proves the instance answered, 404 included — the app has no health
          # route, and what is being tested is whether it is awake, not whether the path exists.
          # A 5xx means it is running but unwell: worth flagging, not worth failing a keep-alive
          # over, since the ping did its job.
          if [ "$code" -ge 500 ]; then
            echo "::warning::Backend responded $code — awake, but returning a server error."
          fi

          # A slow reply means it had gone to sleep and this request paid the cold start, so the
          # schedule is not keeping up.
          if [ "$(printf '%.0f' "$seconds")" -gt 10 ]; then
            echo "::warning::Took ${seconds}s — the service had likely spun down before this ping."
          fi

          echo "### Backend awake — HTTP $code in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"
